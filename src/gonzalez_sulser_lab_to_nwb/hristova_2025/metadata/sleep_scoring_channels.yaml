# EEG and EMG channel used by the lab's sleep scorer for each baseline window, as electrode-table channel names
# (taini_recording_interface.CHANNEL_IDS). Written to the sleep_scoring_eeg_channel and sleep_scoring_emg_channel
# columns of the epochs table.
#
# The scorer's input is <animal>_BL{1,2}_Channels.csv: the two channels picked in Taini_CheckChoose.m, in mV
# (code * 13 / 4095) with packet-loss samples set to 0. Taini_CheckChoose.m offers .dat columns 4/13 for EEG
# (M2_anterior R/L) and 2/15 for EMG (EMG R/L). Each window's channels were identified by matching its Channels.csv
# sample for sample against the 16 .dat channels inside the window; every window matched exactly one EEG and one EMG
# channel. The channels agree with the eeg/emg columns of the lab's rat_day_index_GRIN2B.csv. (The paper's
# supplementary methods describe the scoring EEG as an S1 channel, which is an error in the paper.)
#
# For a new animal, take the channels from rat_day_index_GRIN2B.csv (1-based .dat columns) or match its Channels.csv
# in the same way. An animal not listed here gets no channel columns.

