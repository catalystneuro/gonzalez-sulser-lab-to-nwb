# Metadata shared by every NWB file of the Hristova et al. 2025 conversion.
# session_start_time, session_id, session_description and the subject's ID, sex and genotype are set per subject
# in convert_session.py.

NWBFile:
  experiment_description: >
    Chronic wireless EEG and EMG recordings from freely behaving Long-Evans rats
    carrying a heterozygous knockout of Grin2b (Grin2b+/-), the gene encoding the
    GluN2B subunit of N-methyl-D-aspartate receptors (NMDARs). Grin2b+/- rats
    display spontaneous spike-and-wave discharges (SWDs, the electrographic
    correlate of absence seizures) at higher incidence and duration than wild-type
    littermates, alongside reduced REM sleep and altered NREM/wake distributions.
    Recordings were acquired over 72-96 h using the TaiNi wireless multichannel
    recording system (Tainitec, UK) with 14-channel skull-surface EEG electrode
    grids and bilateral neck EMG electrodes, at 250.4 Hz. Two consecutive 24-h
    baseline windows (BL1, BL2) were extracted per animal. Automated pipelines
    classified sleep states (Wake, NREM, REM) in 5-s epochs and detected SWD
    seizure events. Data contribute to the SFARI Autism Rat Models Consortium (ARC).

  institution: University of Edinburgh
  lab: Gonzalez-Sulser Lab
  experimenter:
    - Hristova, Katerina
    - Fasol, Melissa C. M.
    - McLaughlin, Niamh
    - Nawaz, Mohammad Sarfaraz
    - Taskiran, Mehmet
    - Buller-Peralta, Ingrid
    - Harris, Anjanette P.
    - Sutherland, Andrew
    - Bassi, Alejandro
    - Ocampo-Garces, Adrian
    - Escudero, Javier
    - Kind, Peter C.
    - Gonzalez-Sulser, Alfredo

  keywords:
    - EEG
    - EMG
    - chronic recording
    - sleep
    - seizure
    - spike-wave discharge
    - absence epilepsy
    - circadian rhythm
    - GRIN2B
    - GluN2B
    - NMDA receptor
    - autism
    - SFARI
    - Long-Evans rat
    - wireless telemetry
    - sleep scoring

  related_publications:
    - doi:10.1111/epi.18606

# Shared by every subject. sex and genotype are read per subject from the lab's subject sheet
# (Subject metadata/GRIN2B_CDKL5_Seizures_Overall.csv) in convert_session.get_subject_metadata, and subject_id is set
# from the animal ID. Exact dates of birth are not available; the animals were 16-19 weeks old.
Subject:
  species: Rattus norvegicus
  strain: Long-Evans
  age: P16W/P19W
  description: >
    All animal procedures were undertaken in accordance with the University of Edinburgh animal welfare committee
    regulations and were performed under a United Kingdom Home Office project license. Long-Evans Grin2b
    heterozygous knockout rats were generated by the Medical College of Wisconsin gene Editing Rat Resource Center
    with support from the Simons Foundation Autism Research Initiative (LE-Grin2bem1Mcwi, RRID:RGD_14394515), and
    Grin2b heterozygous knockouts are hereafter referred to as Grin2b+/-, whereas wild-type littermates are
    Grin2b+/+. Subject.genotype is LE-Grin2bem1Mcwi for heterozygous knockouts and WT for wild-type littermates.

# HED annotation of the sleep states, written by SleepStateInterface: a MeaningsTable on the sleep_state column of
# processing/behavior/sleep_states with the meaning and HED tags of each state, the HED schema versions
# (HedLabMetaData, ndx-hed), and a HERD reference from each state to a Neuro Behavior Ontology term. The HED tags follow
# the proposed NWB best practice for sleep states (https://github.com/NeurodataWithoutBorders/nwbinspector/pull/775).
SleepStates:
  hed_schema_version: '["8.4.0", "sc:score_2.1.0"]'
  description: >-
    Meaning of each sleep state label. Scored in 5-s epochs by the Gonzalez-Sulser lab's automated sleep scorer
    (https://github.com/Gonzalez-Sulser-Team/AUTOMATIC-SLEEP-SCORER) from one EEG and one EMG channel.
  states:
    Wake:
      meaning: Wakefulness.
      HED: Awake
      ontology_term: { id: "NBO:0000066", uri: "http://purl.obolibrary.org/obo/NBO_0000066" }
    NREM:
      meaning: Non-rapid eye movement (NREM) sleep.
      HED: Asleep
      ontology_term: { id: "NBO:0000161", uri: "http://purl.obolibrary.org/obo/NBO_0000161" }
    REM:
      meaning: Rapid eye movement (REM) sleep.
      HED: Asleep, sc:Sleep-stage-REM
      ontology_term: { id: "NBO:0000159", uri: "http://purl.obolibrary.org/obo/NBO_0000159" }

# Ontology annotation (HERD). NeuroConv reads every term from this one file-wide `ExternalResources`
