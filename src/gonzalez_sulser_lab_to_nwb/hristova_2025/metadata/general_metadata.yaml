    "primary motor cortex, anterior (M1-Ant)":
      { id: "UBERON:0001384", uri: "http://purl.obolibrary.org/obo/UBERON_0001384" } # primary motor cortex
    "secondary motor cortex, anterior (M2-Ant)":
      { id: "UBERON:0016634", uri: "http://purl.obolibrary.org/obo/UBERON_0016634" } # premotor cortex, synonym secondary motor cortex
    "secondary motor cortex, frontal association area (M2-FrA)":
      { id: "UBERON:0016634", uri: "http://purl.obolibrary.org/obo/UBERON_0016634" } # premotor cortex, synonym secondary motor cortex
    "primary visual cortex, monocular area (V1-M)":
      { id: "UBERON:0002436", uri: "http://purl.obolibrary.org/obo/UBERON_0002436" } # primary visual cortex
    "secondary visual cortex, mediolateral area (V2-ML)":
      { id: "UBERON:0022232", uri: "http://purl.obolibrary.org/obo/UBERON_0022232" } # secondary visual cortex
    "trapezius muscle":
      { id: "UBERON:0002380", uri: "http://purl.obolibrary.org/obo/UBERON_0002380" } # trapezius muscle; EMG electrodes and their ElectrodeGroup
    "cerebral cortex":
