# General metadata for GRIN2B NWB conversion
# Fields marked TODO require lab input (see metadata_request_email.md)
# Session-specific fields (session_start_time, session_id) are set programmatically
# in grin2b_convert_session.py

NWBFile:
  experiment_description: >
    Chronic wireless EEG and EMG recordings from freely behaving Long-Evans rats
    carrying a heterozygous knockout of Grin2b (Grin2b+/-), the gene encoding the
    GluN2B subunit of N-methyl-D-aspartate receptors (NMDARs). Grin2b+/- rats
    display spontaneous spike-and-wave discharges (SWDs, the electrographic
    correlate of absence seizures) at higher incidence and duration than wild-type
    littermates, alongside reduced REM sleep and altered NREM/wake distributions.
    Recordings were acquired over 72-96 h using the TaiNi wireless multichannel
    recording system (Tainitec, UK) with 14-channel skull-surface EEG electrode
    grids and bilateral neck EMG electrodes, at 250.4 Hz. Two consecutive 24-h
    baseline windows (BL1, BL2) were extracted per animal. Automated pipelines
    classified sleep states (Wake, NREM, REM) in 5-s epochs and detected SWD
    seizure events. Data contribute to the SFARI Autism Rat Models Consortium (ARC).
    See Hristova et al., Epilepsia 2025 (doi:10.1111/epi.18606).

  institution: University of Edinburgh
  lab: Gonzalez-Sulser Lab
  experimenter:
    - Hristova, Katerina
    - Fasol, Melissa C. M.
    - McLaughlin, Niamh
    - Nawaz, Mohammad Sarfaraz
    - Taskiran, Mehmet
    - Buller-Peralta, Ingrid
    - Harris, Anjanette P.
    - Sutherland, Andrew
    - Bassi, Alejandro
    - Ocampo-Garces, Adrian
    - Escudero, Javier
    - Kind, Peter C.
    - Gonzalez-Sulser, Alfredo

  keywords:
    - EEG
    - EMG
    - chronic recording
    - sleep
    - seizure
    - spike-wave discharge
    - absence epilepsy
    - circadian rhythm
    - GRIN2B
    - GluN2B
    - NMDA receptor
    - autism
    - SFARI
    - Long-Evans rat
    - wireless telemetry
    - sleep scoring

  related_publications:
    - doi:10.1111/epi.18606

Device:
  - name: TainiTecWirelessEEG
    description: >
      TainiTec wireless EEG/EMG telemetry system. Single-animal headstage with
      16-channel recording (14 EEG + 2 EMG). Data acquired at 250.4 Hz, 12-bit ADC,
      stored as int16 little-endian with no file header.
    manufacturer: TainiTec

  - name: NeuroNexusEEGGrid
    description: >
      NeuroNexus Custom H16-Rat EEG16_Functional chronic skull-surface EEG electrode
      grid. 14 EEG channels plus 2 integrated EMG leads (16-channel headstage total).
      Electrodes arranged bilaterally over somatosensory and motor cortex. The grid
      plus-symbol reference point was aligned over bregma during implantation.
      All EEG electrodes are independent of one another and are not interconnected.
      A separate cerebellar ground screw (-11.5 mm AP, 0.5 mm ML from bregma) was
      connected to the grid via silver paint.
      # TODO: add per-channel stereotaxic coordinates (AP/ML from bregma)
    manufacturer: NeuroNexus

ElectrodeGroup:
  - name: EEGArray
    description: >
      14-channel skull-surface EEG electrode array (NeuroNexus chronic grid).
      Electrodes target bilateral somatosensory and motor cortical sites:
      S1-Tr (Primary somatosensory cortex, trunk region), M2-FrA (Secondary
      motor cortex, frontal association area), M2-Ant (Secondary motor cortex,
      anterior), M1-Ant (Primary motor cortex, anterior), V2-ML (Secondary
      visual cortex, mediolateral), V1-M (Primary visual cortex, monocular),
      S1Hl/Fl (Primary somatosensory cortex, hindlimb/forelimb). 7 electrodes
      per hemisphere.
    location: somatosensory cortex, motor cortex, visual cortex  # bilateral
    device: NeuroNexusEEGGrid

  - name: EMGArray
    description: >
      2-channel electromyogram (EMG) electrodes implanted in the neck muscles
      (bilateral). Used for sleep-state scoring (muscle tone indicator for REM
      vs. wake discrimination).
    location: neck muscle
    device: TainiTecWirelessEEG

# Electrode channel mapping — populated programmatically from lab-confirmed channel order
# TODO: once lab confirms which ch00..ch15 indices = EEG_1..EEG_14 vs EMG_1, EMG_2
# and which (if any) are reference/ground, add explicit mapping here.
# Placeholder:
Electrodes:
  # ch00..ch13: EEG channels (assumed order — MUST CONFIRM)
  # ch14..ch15: EMG channels (assumed order — MUST CONFIRM)
  channel_conversion: 1.0  # TODO: replace with ADC gain (volts per int16 count)
  # e.g. if full-scale = ±0.5 mV mapped to 0-4095: conversion = 1e-3 / 4096

# Light cycle / circadian
LightCycle:
  protocol: 12:12 LD  # Confirmed: paper and supplementary methods
  lights_on_time: "07:00"  # Confirmed from supplementary: "zeitgeber time 07:00 am"
  timezone: Europe/London   # Edinburgh (UTC+0 / BST UTC+1)

# Sleep scoring
SleepScoring:
  epoch_duration_s: 5.0
  scorer: >
    Automated sleep-scoring algorithm developed by the Gonzalez-Sulser lab.
    Source code: https://github.com/Gonzalez-Sulser-Team/AUTOMATIC-SLEEP-SCORER
    (see also Buller-Peralta et al., Brain Commun 2022, doi:10.1093/braincomms/fcac263)
  swd_detector: >
    Automatic SWD detection algorithm: identifies harmonic peaks at 5-10 Hz in power spectra.
    Source code: https://github.com/Gonzalez-Sulser-Team/SWD-Automatic-Identification
    Zenodo: https://zenodo.org/records/12700972
  # Confirmed state code mapping (supplementary methods):
  state_labels:
    0: Wake
    1: NREM
    2: REM
    4: SWD  # Confirmed: "All epochs identified to contain SWDs were classed separately from the other three brain states"
            # s_4 in pw_spectrum.csv = average PSD during spike-wave discharge epochs
