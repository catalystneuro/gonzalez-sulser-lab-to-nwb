# General metadata for GRIN2B NWB conversion
# Session-specific fields (session_start_time, session_id) are set programmatically
# in convert_session.py

NWBFile:
  experiment_description: >
    Chronic wireless EEG and EMG recordings from freely behaving Long-Evans rats
    carrying a heterozygous knockout of Grin2b (Grin2b+/-), the gene encoding the
    GluN2B subunit of N-methyl-D-aspartate receptors (NMDARs). Grin2b+/- rats
    display spontaneous spike-and-wave discharges (SWDs, the electrographic
    correlate of absence seizures) at higher incidence and duration than wild-type
    littermates, alongside reduced REM sleep and altered NREM/wake distributions.
    Recordings were acquired over 72-96 h using the TaiNi wireless multichannel
    recording system (Tainitec, UK) with 14-channel skull-surface EEG electrode
    grids and bilateral neck EMG electrodes, at 250.4 Hz. Two consecutive 24-h
    baseline windows (BL1, BL2) were extracted per animal. Automated pipelines
    classified sleep states (Wake, NREM, REM) in 5-s epochs and detected SWD
    seizure events. Data contribute to the SFARI Autism Rat Models Consortium (ARC).
    See Hristova et al., Epilepsia 2025 (doi:10.1111/epi.18606).

  institution: University of Edinburgh
  lab: Gonzalez-Sulser Lab
  experimenter:
    - Hristova, Katerina
    - Fasol, Melissa C. M.
    - McLaughlin, Niamh
    - Nawaz, Mohammad Sarfaraz
    - Taskiran, Mehmet
    - Buller-Peralta, Ingrid
    - Harris, Anjanette P.
    - Sutherland, Andrew
    - Bassi, Alejandro
    - Ocampo-Garces, Adrian
    - Escudero, Javier
    - Kind, Peter C.
    - Gonzalez-Sulser, Alfredo

  keywords:
    - EEG
    - EMG
    - chronic recording
    - sleep
    - seizure
    - spike-wave discharge
    - absence epilepsy
    - circadian rhythm
    - GRIN2B
    - GluN2B
    - NMDA receptor
    - autism
    - SFARI
    - Long-Evans rat
    - wireless telemetry
    - sleep scoring

  related_publications:
    - doi:10.1111/epi.18606

# Light cycle / circadian
LightCycle:
  protocol: 12:12 LD # Confirmed: paper and supplementary methods
  lights_on_time: "07:00" # Confirmed from supplementary: "zeitgeber time 07:00 am"
  timezone: Europe/London # Edinburgh (UTC+0 / BST UTC+1)

# Sleep scoring
SleepScoring:
  epoch_duration_s: 5.0
  scorer: >
    Automated sleep-scoring algorithm developed by the Gonzalez-Sulser lab.
    Source code: https://github.com/Gonzalez-Sulser-Team/AUTOMATIC-SLEEP-SCORER
    (see also Buller-Peralta et al., Brain Commun 2022, doi:10.1093/braincomms/fcac263)
  swd_detector: >
    Automatic SWD detection algorithm: identifies harmonic peaks at 5-10 Hz in power spectra.
    Source code: https://github.com/Gonzalez-Sulser-Team/SWD-Automatic-Identification
    Zenodo: https://zenodo.org/records/12700972
  # Confirmed state code mapping (supplementary methods):
  state_labels:
    0: Wake
    1: NREM
    2: REM
    4:
      SWD # Confirmed: "All epochs identified to contain SWDs were classed separately from the other three brain states"
      # s_4 in pw_spectrum.csv = average PSD during spike-wave discharge epochs

# Ontology annotation (HERD): maps electrode/electrode-group "location" strings to UBERON terms.
# Rat has no offline Allen-atlas lookup in NeuroConv (mouse/human only), so this closes that gap
# via the ontology-agnostic metadata["BrainRegions"] override. IDs verified against the EBI
# Ontology Lookup Service (https://www.ebi.ac.uk/ols4), not hardcoded from memory.
# Per-channel labels from taini_recording_interface.py's _CHANNEL_MAP docstring; S1_Tr and
# S1Hl_S1Fl both map to the general primary somatosensory cortex term (UBERON has no rat-specific
# trunk/hindlimb/forelimb subdivision), and M2_Fra/M2_anterior both map to the secondary motor
# cortex term (UBERON's "premotor cortex" entry, whose synonyms include "secondary motor cortex").
BrainRegions:
  S1_Tr: { id: "UBERON:0008933", uri: "http://purl.obolibrary.org/obo/UBERON_0008933" } # primary somatosensory cortex
  S1Hl_S1Fl: { id: "UBERON:0008933", uri: "http://purl.obolibrary.org/obo/UBERON_0008933" } # primary somatosensory cortex
  M1_anterior: { id: "UBERON:0001384", uri: "http://purl.obolibrary.org/obo/UBERON_0001384" } # primary motor cortex
  M2_Fra: { id: "UBERON:0016634", uri: "http://purl.obolibrary.org/obo/UBERON_0016634" } # secondary motor (premotor) cortex
  M2_anterior: { id: "UBERON:0016634", uri: "http://purl.obolibrary.org/obo/UBERON_0016634" } # secondary motor (premotor) cortex
  V1_M: { id: "UBERON:0002436", uri: "http://purl.obolibrary.org/obo/UBERON_0002436" } # primary visual cortex
  V2_ML: { id: "UBERON:0022232", uri: "http://purl.obolibrary.org/obo/UBERON_0022232" } # secondary visual cortex
  EMG: { id: "UBERON:0002380", uri: "http://purl.obolibrary.org/obo/UBERON_0002380" } # trapezius muscle (EMG electrode placement, not brain)
  cortex: { id: "UBERON:0000956", uri: "http://purl.obolibrary.org/obo/UBERON_0000956" } # cerebral cortex (ElectrodeGroup.location for EEGArray)
  trapezius muscle: { id: "UBERON:0002380", uri: "http://purl.obolibrary.org/obo/UBERON_0002380" } # ElectrodeGroup.location for EMGArray
