# General metadata for GRIN2B NWB conversion
# Session-specific fields (session_start_time, session_id) are set programmatically
# in convert_session.py

NWBFile:
  experiment_description: >
    Chronic wireless EEG and EMG recordings from freely behaving Long-Evans rats
    carrying a heterozygous knockout of Grin2b (Grin2b+/-), the gene encoding the
    GluN2B subunit of N-methyl-D-aspartate receptors (NMDARs). Grin2b+/- rats
    display spontaneous spike-and-wave discharges (SWDs, the electrographic
    correlate of absence seizures) at higher incidence and duration than wild-type
    littermates, alongside reduced REM sleep and altered NREM/wake distributions.
    Recordings were acquired over 72-96 h using the TaiNi wireless multichannel
    recording system (Tainitec, UK) with 14-channel skull-surface EEG electrode
    grids and bilateral neck EMG electrodes, at 250.4 Hz. Two consecutive 24-h
    baseline windows (BL1, BL2) were extracted per animal. Automated pipelines
    classified sleep states (Wake, NREM, REM) in 5-s epochs and detected SWD
    seizure events. Data contribute to the SFARI Autism Rat Models Consortium (ARC).
    See Hristova et al., Epilepsia 2025 (doi:10.1111/epi.18606).

  institution: University of Edinburgh
  lab: Gonzalez-Sulser Lab
  experimenter:
    - Hristova, Katerina
    - Fasol, Melissa C. M.
    - McLaughlin, Niamh
    - Nawaz, Mohammad Sarfaraz
    - Taskiran, Mehmet
    - Buller-Peralta, Ingrid
    - Harris, Anjanette P.
    - Sutherland, Andrew
    - Bassi, Alejandro
    - Ocampo-Garces, Adrian
    - Escudero, Javier
    - Kind, Peter C.
    - Gonzalez-Sulser, Alfredo

  keywords:
    - EEG
    - EMG
    - chronic recording
    - sleep
    - seizure
    - spike-wave discharge
    - absence epilepsy
    - circadian rhythm
    - GRIN2B
    - GluN2B
    - NMDA receptor
    - autism
    - SFARI
    - Long-Evans rat
    - wireless telemetry
    - sleep scoring

  related_publications:
    - doi:10.1111/epi.18606

# Light cycle / circadian
LightCycle:
  protocol: 12:12 LD # Confirmed: paper and supplementary methods
  lights_on_time: "07:00" # Confirmed from supplementary: "zeitgeber time 07:00 am"
  timezone: Europe/London # Edinburgh (UTC+0 / BST UTC+1)

# Sleep scoring
SleepScoring:
  epoch_duration_s: 5.0
  scorer: >
    Automated sleep-scoring algorithm developed by the Gonzalez-Sulser lab.
    Source code: https://github.com/Gonzalez-Sulser-Team/AUTOMATIC-SLEEP-SCORER
    (see also Buller-Peralta et al., Brain Commun 2022, doi:10.1093/braincomms/fcac263)
  swd_detector: >
    Automatic SWD detection algorithm: identifies harmonic peaks at 5-10 Hz in power spectra.
    Source code: https://github.com/Gonzalez-Sulser-Team/SWD-Automatic-Identification
    Zenodo: https://zenodo.org/records/12700972
  # Confirmed state code mapping (supplementary methods):
  state_labels:
    0: Wake
    1: NREM
    2: REM
    4:
      SWD # Confirmed: "All epochs identified to contain SWDs were classed separately from the other three brain states"
      # s_4 in pw_spectrum.csv = average PSD during spike-wave discharge epochs
