[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gonzalez-sulser-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for Gonzalez-Sulser Lab"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pynwb>=4.0.0",
    "nwbinspector",
    "neuroconv",
]

[project.urls]
Repository = "https://github.com/catalystneuro/gonzalez-sulser-lab-to-nwb"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gonzalez_sulser_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
