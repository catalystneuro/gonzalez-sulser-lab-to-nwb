[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gonzalez-sulser-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for Gonzalez-Sulser Lab"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "alessandra.trapani@catalystneuro.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # HERD (ontology) support is on NeuroConv main but not in a release yet (0.10.2 predates it).
    "neuroconv @ git+https://github.com/catalystneuro/neuroconv.git@0b1d6d4bd38f6fba982d89748bb5535731a3f921",
    "pynwb>=4.2.0",
    "ndx-hed==0.3.0",
    "spikeinterface",
    "nwbinspector>=0.7.1",
    "dandi>=0.76",
    "pandas",
    "openpyxl",
    "pyyaml",
]

[project.scripts]
hristova-2025 = "gonzalez_sulser_lab_to_nwb.hristova_2025.cli:main"

[project.urls]
Repository = "https://github.com/catalystneuro/gonzalez-sulser-lab-to-nwb"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gonzalez_sulser_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
